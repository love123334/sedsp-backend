# Railway — https://railway.app
# Repo: love123334/sedsp-backend · branch railway (or main)

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# ping-only — /actuator/health returns 503 if DB indicator is DOWN
healthcheckPath = "/actuator/health/liveness"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 8
