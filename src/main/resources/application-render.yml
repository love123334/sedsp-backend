server:
  port: ${PORT:8080}

spring:
  datasource:
    # Entrypoint converts DATABASE_URL (postgres://...) → jdbc:postgresql://...
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sedsp}
    username: ${SPRING_DATASOURCE_USERNAME:}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5

  data:
    redis:
      # REDIS_URL → SPRING_DATA_REDIS_URL (entrypoint). Fallback local:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    # Redis down không làm cả app báo DOWN lúc cold start
    redis:
      enabled: false

logging:
  level:
    root: INFO
    com.example.secdsp: INFO
    org.hibernate.SQL: WARN
