spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/sedsp
    username: postgres
    password: 123456
    driver-class-name: org.postgresql.Driver

  redis:
    host: redis
    port: 6379

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration