server:
  port: ${PORT:8080}

spring:
  datasource:
    # Filled by DatabaseUrlEnvironmentPostProcessor from DATABASE_PUBLIC_URL / DATABASE_URL / PG*
    url: ${SPRING_DATASOURCE_URL:}
    username: ${SPRING_DATASOURCE_USERNAME:${PGUSER:}}
    password: ${SPRING_DATASOURCE_PASSWORD:${PGPASSWORD:}}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      connection-timeout: 20000

  data:
    redis:
      url: ${SPRING_DATA_REDIS_URL:${REDIS_URL:}}
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
      group:
        # Railway healthcheck — do NOT require DB (otherwise 503 during deploy)
        liveness:
          include: ping
        readiness:
          include: ping
  health:
    redis:
      enabled: false
    db:
      enabled: false
    diskspace:
      enabled: false

logging:
  level:
    root: INFO
    com.example.secdsp: INFO
    org.hibernate.SQL: WARN
    com.zaxxer.hikari: INFO
