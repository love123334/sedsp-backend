server:
  port: ${PORT:8080}
  address: 0.0.0.0

spring:
  main:
    banner-mode: "off"
  datasource:
    # Filled by DatabaseUrlEnvironmentPostProcessor / start.sh from DATABASE_PUBLIC_URL
    url: ${SPRING_DATASOURCE_URL:}
    username: ${SPRING_DATASOURCE_USERNAME:${PGUSER:}}
    password: ${SPRING_DATASOURCE_PASSWORD:${PGPASSWORD:}}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 15000
      validation-timeout: 5000
      initialization-fail-timeout: 30000

  # Redis starter is unused (OTP is DB-backed). Exclude so missing REDIS_URL cannot break boot.
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

  data:
    redis:
      url: ${SPRING_DATA_REDIS_URL:${REDIS_URL:}}
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}

  jpa:
    hibernate:
      # Flyway owns schema on Railway — validate can crash boot on minor drift and hide Flyway root cause
      ddl-auto: none
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Ho_Chi_Minh

  flyway:
    enabled: true
    locations: classpath:db/migration
    # Clear failed migrate rows / checksum drift after hotfix (e.g. V24 public_id, V35 reformat, V42)
    repair-on-migrate: true
    # Don't hard-fail deploy on checksum noise after hotfix migrations
    validate-on-migrate: false
    connect-retries: 5
    connect-retries-interval: 5s
    postgresql:
      transactional-lock: false
    # Longer statement timeout for seed migrations; V42 is now a no-op
    # (default locks can still drop Hikari connections if a migrate hangs)

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:true}
          ssl:
            enable: ${MAIL_SMTP_SSL:false}
          # Prevent register/health from hanging forever when SMTP is blocked
          connectiontimeout: 8000
          timeout: 8000
          writetimeout: 8000

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
      group:
        # Railway healthcheck — do NOT require DB (otherwise 503 during deploy)
        liveness:
          include: ping
        readiness:
          include: ping
  health:
    redis:
      enabled: false
    db:
      enabled: false
    diskspace:
      enabled: false
    # Gmail SMTP often blocked/slow from Railway — do NOT include in /actuator/health
    mail:
      enabled: false

# OTP mail on Railway Hobby: set RESEND_API_KEY (+ MAIL_FROM). SMTP (MAIL_*) stays blocked on free/hobby.

logging:
  level:
    root: INFO
    com.example.secdsp: INFO
    org.hibernate.SQL: WARN
    org.hibernate.orm.connections.pooling: WARN
    com.zaxxer.hikari: WARN
    org.flywaydb: INFO
    org.springframework.mail: WARN
    org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer: ERROR

# Absolute URL for /uploads when Cloudinary is missing/misconfigured
app:
  dss:
    # Copied into the image by Dockerfile. Native ONNX is not in the Railway
    # fat JAR (-PexcludeOnnx); keep required=false so boot can fall back.
    model-dir: ${DSS_MODEL_DIR:/app/models/demand}
    model-required: ${DSS_MODEL_REQUIRED:true}
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}
  upload:
    public-base-url: ${APP_PUBLIC_BASE_URL:https://sedsp-api-production.up.railway.app}
