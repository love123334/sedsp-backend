spring:
  application:
    name: secdsp
  # Local default; Railway/Docker set SPRING_PROFILES_ACTIVE=prod
  profiles:
    default: dev

  # --- Cấu hình Mail ---
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:your_email@gmail.com}
    password: ${MAIL_PASSWORD:your_app_password_here}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  # --- Cấu hình OAuth2 Client ---
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:your_google_client_id}
            client-secret: ${GOOGLE_CLIENT_SECRET:your_google_client_secret}
            scope:
              - email
              - profile

app:
  jwt:
    secret: ${JWT_SECRET:change-this-secret-key-to-a-secure-256-bit-value-for-production-use}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

  # --- Cấu hình Cloudinary (Thêm cho tính năng Ảnh sản phẩm) ---
  # Nếu cloud_name sai (vd. SEDSP) hoặc thiếu key → BE tự lưu vào /uploads và serve public.
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:your_cloud_name}
    api-key: ${CLOUDINARY_API_KEY:your_api_key}
    api-secret: ${CLOUDINARY_API_SECRET:your_api_secret}

  upload:
    dir: ${UPLOAD_DIR:uploads}
    # Railway: để trống để dùng https://$RAILWAY_PUBLIC_DOMAIN, hoặc set URL public của service
    public-base-url: ${APP_PUBLIC_BASE_URL:}

  # --- Cấu hình Mail Tùy chỉnh ---
  mail:
    from: ${MAIL_FROM:your_email@gmail.com}
    logo-path: ${MAIL_LOGO_PATH:static/images/sedsp-logo.png}
    otp-expiration-minutes: ${MAIL_OTP_EXPIRATION:5}
    resend-cooldown-seconds: ${MAIL_RESEND_COOLDOWN:60}
    max-resend-attempts: ${MAIL_MAX_RESEND_ATTEMPTS:5}
    # Resend HTTPS (Railway Hobby blocks SMTP) — set RESEND_API_KEY to prefer API over Gmail SMTP
    resend-api-key: ${RESEND_API_KEY:}
    resend-api-url: ${RESEND_API_URL:https://api.resend.com/emails}

  # --- Cấu hình Redirect OAuth2 ---
  oauth2:
    redirect-uri: ${OAUTH2_REDIRECT_URI:http://localhost:3000/oauth2-success}

  # Frontend origins (Vercel + local). Env merges with built-in Vercel patterns in CorsConfig.
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,https://*.vercel.app}

  # Base URL FE — redirect sau thanh toán gateway → /payment/result rồi về /cart
  # Production (Railway): set FRONTEND_BASE_URL=https://smartecon-fe.vercel.app
  frontend:
    base-url: ${FRONTEND_BASE_URL:https://smartecon-fe.vercel.app}

  # --- AI OpenAI-compatible (OpenRouter / HF) — token chỉ trên BE ---
  ai:
    enabled: ${AI_ENABLED:false}
    api-token: ${OPENROUTER_API_KEY:${AI_API_TOKEN:${HF_API_TOKEN:}}}
    base-url: ${AI_API_BASE_URL:https://openrouter.ai/api/v1}
    model: ${AI_MODEL:openrouter/free}
    temperature: ${AI_TEMPERATURE:0.5}
    max-tokens: ${AI_MAX_TOKENS:900}

  # --- Power BI / Looker Studio (embed URL sau khi publish report) ---
  powerbi:
    embed-url: ${POWERBI_EMBED_URL:}
    report-title: ${POWERBI_REPORT_TITLE:SEDSP Decision Dashboard}

  # Platform Looker Studio (manager revenue) — FE cũng hardcode cùng URL
  looker:
    studio-embed-url: ${LOOKER_STUDIO_EMBED_URL:https://datastudio.google.com/embed/reporting/88f0776f-62a9-409c-8c78-40e9cd4b9f26/page/Y0b5F}

  order:
    payment-timeout-minutes: ${ORDER_PAYMENT_TIMEOUT_MINUTES:15}
    payment-expiry-check-ms: ${ORDER_PAYMENT_EXPIRY_CHECK_MS:60000}

  # --- DSS: kịch bản giá, chi phí ước tính, kỳ dự báo ---
  dss:
    max-price-change-percent: 300
    price-change-percentages:
      - -10
      - -5
      - 0
      - 5
      - 10
    default-forecast-days: 30
    platform-fee-percent: 2.0
    avg-shipping-per-unit-vnd: 25000
    operating-cost-per-unit-vnd: 0
    include-shipping-in-profit: true
    include-platform-fee: true
    profit-tolerance-percent: 3.0

  # --- Cấu hình Payment ---
  payment:
    vnpay:
      tmn-code: ${VNPAY_TMN_CODE:YOUR_DEFAULT_TMN_CODE}
      secret-key: ${VNPAY_HASH_SECRET:YOUR_DEFAULT_HASH_SECRET}
      pay-url: ${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
      return-url: ${VNPAY_RETURN_URL:http://localhost:8080/api/v1/payments/vnpay-return}
      ipn-url: ${VNPAY_IPN_URL:http://localhost:8080/api/v1/payments/vnpay-ipn}
      version: "2.1.0"
      command: "pay"

    momo:
      partner-code: ${MOMO_PARTNER_CODE:YOUR_DEFAULT_PARTNER_CODE}
      access-key: ${MOMO_ACCESS_KEY:YOUR_DEFAULT_ACCESS_KEY}
      secret-key: ${MOMO_SECRET_KEY:YOUR_DEFAULT_SECRET_KEY}
      endpoint: ${MOMO_ENDPOINT:https://test-payment.momo.vn/v2/gateway/api/create}
      return-url: ${MOMO_RETURN_URL:http://localhost:8080/api/v1/payments/momo-return}
      notify-url: ${MOMO_NOTIFY_URL:http://localhost:8080/api/v1/payments/momo-ipn}
      request-type: "captureWallet"

  # --- Cấu hình OpenAI SDK (MCP) ---
google:
  ai:
    api-key: ${GEMINI_API_KEY}
    model: "gemini-3.6-flash"