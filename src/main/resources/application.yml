spring:
  application:
    name: secdsp
  profiles:
    active: dev
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:your_email@gmail.com}
    password: ${MAIL_PASSWORD:your_app_password_here}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  jwt:
    secret: ${JWT_SECRET:change-this-secret-key-to-a-secure-256-bit-value-for-production-use}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

  mail:
    from: ${MAIL_FROM:your_email@gmail.com}
    logo-path: ${MAIL_LOGO_PATH:static/images/sedsp-logo.png}
    otp-expiration-minutes: ${MAIL_OTP_EXPIRATION:5}
    resend-cooldown-seconds: ${MAIL_RESEND_COOLDOWN:60}
    max-resend-attempts: ${MAIL_MAX_RESEND_ATTEMPTS:5}